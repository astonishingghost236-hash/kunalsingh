<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" fill="none">
  <style>
    @keyframes node-blink {
      0%, 100% { opacity: .16; transform: scale(.72); }
      45% { opacity: .2; transform: scale(.8); }
      50% { opacity: 1; transform: scale(1.35); }
      56% { opacity: .16; transform: scale(.72); }
    }
    .neural-node { animation: node-blink var(--blink-duration) ease-in-out infinite; filter: drop-shadow(0 0 6px #68b4ff); transform-box: fill-box; transform-origin: center; }
    @media (prefers-reduced-motion: reduce) {
      .neural-node { animation: none; opacity: .56; transform: none; }
    }
  </style>
  <g stroke="#398BFF" stroke-width="1.2">
    <path d="M40 120 180 70 230 190 365 110 450 250 580 155 690 75 760 230 900 165" opacity=".34"/>
